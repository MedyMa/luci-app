<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Migu.  Shipped locally rather than fetched: no indexed icon set carries a
       colour mark for this brand, and the only one that has it at all
       (arcticons) supplies a thin outline, which is the wrong answer for a
       brand.  Local icons win over every upstream set, so this is what the page
       will use.

       The background rect and its gradient were dropped so the mark matches the
       rest of the set, which is transparent; the page draws its own rounded box
       behind the icon and paints it transparent once the icon loads.  The
       xmlns was also corrected from http://w3.org to the SVG namespace - with
       the wrong namespace the file renders as nothing at all in an <img>, which
       is how it would have shipped. -->
  <g transform="translate(25, 25)">
    <!-- The diagonal is drawn FIRST and the red uprights over it.  It was
         originally painted last with mix-blend-mode: multiply, which needs an
         opaque backdrop to blend against: with the background rect removed the
         crossing multiplied against transparency and came out BLACK, which is
         not the mark.  Ordering instead of blending needs no backdrop, and the
         result is the same solid blue-through-red the original had. -->
    <line x1="110" y1="390" x2="390" y2="110" stroke="#008BE3" stroke-width="56"
          stroke-linecap="round" />
    <!-- left upright of the M -->
    <path d="M 110 330 L 110 140 A 30 30 0 0 1 161 119 L 245 175"
          fill="none" stroke="#E2231A" stroke-width="56"
          stroke-linecap="round" stroke-linejoin="round" />
    <!-- right upright of the M -->
    <path d="M 270 210 L 340 160 A 30 30 0 0 1 390 185 L 390 390"
          fill="none" stroke="#E2231A" stroke-width="56"
          stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
