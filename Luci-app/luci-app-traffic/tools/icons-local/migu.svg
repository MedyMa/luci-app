<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Migu.  Shipped locally because no indexed icon set carries a colour mark
       for it: dashboard-icons has no entry and no similar slug, and the only set
       that has it at all (arcticons) supplies a thin outline.

       This is the user's own artwork - background gradient, rounded tile, the
       #E2231A red, the #008BE3 blue, geometry and draw order all as supplied.
       Two properties differ, both verified by rendering:

         xmlns  read "http://w3.org"; the SVG namespace is
                "http://www.w3.org/2000/svg".  SVG is XML, so elements outside
                the SVG namespace are not SVG elements and an <img> renders
                nothing at all.
         the diagonal used mix-blend-mode: multiply, and multiply of #008BE3
                with #E2231A is near black in every channel - it produced a black
                patch at the crossing, which the reference art does not have.
                Opaque, drawn last, matches the reference.

       A separate file was supplied as .svg but is a PNG (it begins with the PNG
       signature and contains no SVG markup).  Wrapping that raster in an SVG was
       attempted and did NOT render, so it is not shipped; this vector version is
       the one verified at light, dark and the 34px row size. -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#f1f3f5"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="80"/>

  <g transform="translate(25, 25)">
    <path d="M 110 330
             L 110 140
             A 30 30 0 0 1 161 119
             L 245 175"
          fill="none"
          stroke="#E2231A"
          stroke-width="56"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <path d="M 270 210
             L 340 160
             A 30 30 0 0 1 390 185
             L 390 390"
          fill="none"
          stroke="#E2231A"
          stroke-width="56"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <line x1="110" y1="390" x2="390" y2="110"
          stroke="#008BE3"
          stroke-width="56"
          stroke-linecap="round" />
  </g>
</svg>
